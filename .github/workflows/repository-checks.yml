name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'

      - name: Install the pinned repository-test dependency
        run: python -m pip install numpy==2.1.3 h5py==3.12.1

      - name: Install the pinned repository-test dependency
        run: python -m pip install numpy==2.1.3 h5py==3.12.1

      - name: Compile Python sources
        run: python -m compileall -q benchmarks tests tools

      - name: Run repository-only tests
        run: |
          python tests/check_dependency_pins_test.py
          python tests/fused_source_generator_test.py
          python tests/check_license_payload.py --source-root .
          python tests/etpeth_workload_test.py
          python benchmarks/test_run.py
          python tests/deepmd_artifact_manifest_test.py
          python tests/etpeth_pmf_test.py
          python tests/dprc_labels_test.py
          python tests/quick_pbe0_qualification_test.py
          python tests/dprc_binary64_io_test.py
          python tests/dprc_correction_io_test.py
          python tests/lammps_xtb_oracle_compare_test.py
          python tests/deepmd_overlay_input_test.py
          python tests/deepmd_center_mask_input_test.py
          python tests/unqualified_dpa4c_generator_test.py

  lammps-cpu-smoke:
    # This is an integration smoke test, not a performance or scientific
    # qualification job.  It exercises the real LAMMPS plugin loader and the
    # dprc/info command on a CPU-only runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed plugin source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'

      - name: Install the CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libopenmpi-dev openmpi-bin libopenblas-dev

      - name: Check out the pinned LAMMPS host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lammps/lammps
          ref: 7bd373ebc61a8028be955e6be862d5a091fd59c5
          path: lammps
          fetch-depth: 1

      - name: Check out the public xTBloom headers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jinzhezenggroup/xtbloom
          # The reviewed xTBloom pin is retained by the dependency manifest,
          # but is not currently advertised by a public remote ref.  This
          # compile-only smoke therefore uses the current public revision and
          # enables CMake's explicit unpinned diagnostic mode below.
          ref: 5bc0c046e5fcc748e80c027f25c35214f363bd46
          path: xtbloom
          # xTBloom resolves its product version from Git tags during CMake
          # configuration, so a shallow checkout is not sufficient here.
          fetch-depth: 0

      - name: Generate the xTBloom public version header
        run: |
          cmake -S xtbloom -B xtbloom-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_ENABLE_TORCH_EXT=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=OFF

      - name: Configure a minimal MPI LAMMPS executable
        run: |
          cmake -S lammps/cmake -B lammps-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DMPI_C_COMPILER=mpicc \
            -DMPI_CXX_COMPILER=mpicxx \
            -DBUILD_MPI=ON \
            -DBUILD_OMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLAMMPS_SIZES=smallbig \
            -DPKG_PLUGIN=ON \
            -DPKG_KSPACE=ON \
            -DPKG_MOLECULE=ON

      - name: Build LAMMPS
        run: cmake --build lammps-build --target lmp --parallel 2

      - name: Configure LAMMPS-DPRc against that host
        run: |
          cmake -S . -B dprc-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DMPI_CXX_COMPILER=mpicxx \
            -DLAMMPS_SOURCE_DIR="$GITHUB_WORKSPACE/lammps/src" \
            -DXTBLOOM_SOURCE_DIR="$GITHUB_WORKSPACE/xtbloom" \
            -DXTBLOOM_GENERATED_INCLUDE_DIR="$GITHUB_WORKSPACE/xtbloom-build/generated/include" \
            -DDPRC_ALLOW_UNPINNED_DEPENDENCIES=ON \
            -DDPRC_LAMMPS_EXECUTABLE="$GITHUB_WORKSPACE/lammps-build/lmp" \
            -DDPRC_BUILD_TESTING=ON \
            -DDPRC_REQUIRE_XTBLOOM_LIBRARY=OFF

      - name: Build the plugin
        run: cmake --build dprc-build --parallel 2

      - name: Run a diagnostic LAMMPS plugin smoke
        run: |
          lammps-build/lmp \
            -log none \
            -var dprc_plugin "$GITHUB_WORKSPACE/dprc-build/dprcplugin.so" \
            -var dprc_marker "$GITHUB_WORKSPACE/dprc-build/direct-dprc-info.txt" \
            -in "$GITHUB_WORKSPACE/tests/in.dprc_info"

      - name: Run C++ and LAMMPS integration tests
        env:
          # The hosted runner exposes fewer CPU slots than the 2x2 partition
          # smoke intentionally exercises; this affects launch capacity only.
          OMPI_MCA_rmaps_base_oversubscribe: '1'
        run: |
          ctest --test-dir dprc-build --output-on-failure \
            -R '^(dprc\\.|xtb\\.|lammps\\.plugin\\.)'
